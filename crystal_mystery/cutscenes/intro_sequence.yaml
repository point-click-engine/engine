name: "intro_sequence"
description: "A cinematic opening that sets the mood for the Crystal Mystery"
skippable: true
auto_advance: true
version: 2

# ═══════════════════════════════════════════════════════════════════════════════
# ACT I: THE NIGHT BEFORE
# ═══════════════════════════════════════════════════════════════════════════════

actions:
  # --- SCENE 1: PROLOGUE - THE LEGEND ---

  - type: hide_ui

  - type: set_letterbox
    enabled: true
    ratio: 2.35  # Cinematic widescreen

  - type: fade_from_color
    color: [0, 0, 0, 255]
    duration: 0.1

  - type: play_music
    track: "mystery_theme"
    volume: 0.0
    fade_in: 0.0

  # Atmospheric opening with stars/particles
  - type: show_background
    image: "assets/backgrounds/moonlit_sky.png"
    transition: "fade"
    duration: 3.0

  - type: particle_effect
    effect: "sparkles"
    position: "fullscreen"
    intensity: 0.3
    duration: 15.0
    layer: "foreground"

  - type: play_music
    track: "mystery_theme"
    volume: 0.5
    fade_in: 4.0

  - type: wait
    duration: 2.0

  # Title card with dramatic reveal
  - type: show_text
    text: "In the mountains of Eastern Europe..."
    font_size: 24
    color: [180, 180, 200, 255]
    position: "center"
    fade_in: 2.0
    duration: 4.0
    fade_out: 1.5
    style: "italic"

  - type: wait
    duration: 1.0

  - type: show_text
    text: "...there existed a crystal of immense power."
    font_size: 24
    color: [180, 180, 200, 255]
    position: "center"
    fade_in: 1.5
    duration: 4.0
    fade_out: 1.5
    style: "italic"

  # Crystal visualization
  - type: show_sprite
    sprite: "assets/items/crystal.png"
    position: {x: 160, y: 90}
    scale: 2.0
    fade_in: 2.0
    glow: true
    glow_color: [100, 150, 255, 200]
    glow_intensity: 1.5

  - type: particle_effect
    effect: "sparkles"
    position: {x: 160, y: 90}
    intensity: 0.8
    color: [150, 200, 255, 255]
    duration: 8.0
    radius: 40

  - type: wait
    duration: 1.0

  - type: show_text
    text: "The Crystal of Luminus"
    font_size: 48
    color: [150, 200, 255, 255]
    position: "center_top"
    fade_in: 2.0
    duration: 4.0
    fade_out: 1.0
    glow: true
    glow_color: [100, 150, 255, 150]

  - type: wait
    duration: 2.0

  - type: show_text
    text: "Said to reveal hidden truths..."
    font_size: 20
    color: [200, 200, 220, 255]
    position: "center_bottom"
    fade_in: 1.5
    duration: 3.5
    fade_out: 1.0
    style: "italic"

  - type: wait
    duration: 2.0

  - type: show_text
    text: "...and drive men to madness."
    font_size: 20
    color: [255, 150, 150, 255]
    position: "center_bottom"
    fade_in: 1.5
    duration: 3.5
    fade_out: 1.0
    style: "italic"

  - type: camera_shake
    intensity: 3.0
    duration: 0.5
    frequency: 15.0

  - type: wait
    duration: 1.5

  # Fade crystal and transition
  - type: hide_sprite
    sprite: "crystal"
    fade_out: 2.0

  - type: fade_to_color
    color: [0, 0, 0, 255]
    duration: 2.0

  - type: wait
    duration: 1.0

# ═══════════════════════════════════════════════════════════════════════════════
# ACT II: ASHWORTH MANOR - PRESENT DAY
# ═══════════════════════════════════════════════════════════════════════════════

  - type: show_text
    text: "Ashworth Manor"
    font_size: 36
    color: [200, 180, 150, 255]
    position: "center"
    fade_in: 2.0
    duration: 3.0
    fade_out: 1.0

  - type: show_text
    text: "Present Day - 11:47 PM"
    font_size: 20
    color: [150, 150, 170, 255]
    position: "center_bottom"
    fade_in: 1.0
    duration: 2.5
    fade_out: 1.0

  - type: wait
    duration: 1.0

  # Mansion exterior with storm
  - type: show_background
    image: "assets/backgrounds/castle_silhouette.png"
    transition: "fade"
    duration: 2.0
    parallax_layer: 1

  - type: show_background
    image: "assets/backgrounds/moonlit_sky.png"
    transition: "fade"
    duration: 2.0
    parallax_layer: 0

  - type: fade_in
    duration: 2.0

  # Storm effects
  - type: particle_effect
    effect: "rain"
    position: "fullscreen"
    intensity: 0.7
    duration: 20.0

  - type: play_ambient
    sound: "rain_loop"
    volume: 0.4
    fade_in: 2.0

  - type: wait
    duration: 2.0

  # Lightning flash
  - type: screen_flash
    color: [255, 255, 255, 200]
    duration: 0.1

  - type: sound_effect
    sound: "thunder"
    volume: 0.8
    delay: 0.3

  - type: camera_shake
    intensity: 5.0
    duration: 0.8
    frequency: 8.0

  - type: wait
    duration: 2.0

  # Camera slowly pans up to reveal the manor
  - type: camera_pan
    from: {x: 160, y: 150}
    to: {x: 160, y: 80}
    duration: 4.0
    easing: "ease_in_out"

  - type: wait
    duration: 1.0

  # Single lit window
  - type: show_sprite
    sprite: "assets/decorations/animated/candle_1/candle_1_1.png"
    position: {x: 180, y: 60}
    scale: 0.5
    fade_in: 1.0
    animate: true
    animation_frames: 4
    animation_fps: 8

  - type: particle_effect
    effect: "fire"
    position: {x: 180, y: 55}
    intensity: 0.2
    duration: 10.0
    color: [255, 200, 100, 255]

  - type: wait
    duration: 2.0

  # Narration
  - type: show_text
    text: "In the laboratory, Professor Ashworth works late into the night..."
    font_size: 18
    color: [200, 200, 200, 255]
    position: "bottom"
    fade_in: 1.5
    duration: 4.0
    fade_out: 1.0

  - type: wait
    duration: 2.0

  # Another lightning flash
  - type: screen_flash
    color: [200, 200, 255, 180]
    duration: 0.15

  - type: sound_effect
    sound: "thunder"
    volume: 0.6
    delay: 1.0

  - type: wait
    duration: 1.5

# ═══════════════════════════════════════════════════════════════════════════════
# ACT III: THE LABORATORY
# ═══════════════════════════════════════════════════════════════════════════════

  - type: fade_to_color
    color: [0, 0, 0, 255]
    duration: 1.5

  - type: change_scene
    target: "laboratory"

  - type: stop_particle_effect
    effect: "rain"

  - type: stop_ambient
    sound: "rain_loop"
    fade_out: 1.0

  - type: play_music
    track: "laboratory_theme"
    volume: 0.5
    fade_in: 3.0
    crossfade: true

  - type: fade_in
    duration: 2.0

  # Laboratory ambience
  - type: play_ambient
    sound: "laboratory_hum"
    volume: 0.3
    fade_in: 1.0

  - type: particle_effect
    effect: "smoke"
    position: {x: 100, y: 120}
    intensity: 0.2
    duration: 15.0
    color: [200, 200, 200, 100]

  - type: wait
    duration: 1.0

  # Camera focuses on the crystal display
  - type: camera_zoom
    target: 1.5
    focus: {x: 200, y: 100}
    duration: 3.0
    easing: "ease_out"

  # Crystal on display with glow
  - type: show_sprite
    sprite: "assets/items/crystal.png"
    position: {x: 200, y: 100}
    scale: 1.5
    glow: true
    glow_color: [100, 180, 255, 200]
    glow_pulse: true
    glow_pulse_speed: 2.0

  - type: particle_effect
    effect: "sparkles"
    position: {x: 200, y: 100}
    intensity: 0.5
    duration: 10.0
    color: [150, 200, 255, 200]
    radius: 30

  - type: wait
    duration: 2.0

  # Scientist enters frame
  - type: character_enter
    character: "scientist"
    from: "right"
    to: {x: 250, y: 140}
    animation: "walk"
    duration: 2.0

  - type: character_face
    character: "scientist"
    direction: "left"

  - type: wait
    duration: 1.0

  # Scientist admires the crystal
  - type: character_animation
    character: "scientist"
    animation: "examine"
    duration: 2.0

  - type: floating_dialog
    character: "scientist"
    text: "Magnificent... after all these years, its power remains unchanged."
    duration: 4.0
    style: "wonder"
    voice_pitch: 1.0

  - type: wait
    duration: 1.0

  - type: floating_dialog
    character: "scientist"
    text: "The experiments are nearly complete. Soon, the world will understand."
    duration: 4.0
    style: "determined"

  - type: wait
    duration: 2.0

  # Sound of clock chiming
  - type: sound_effect
    sound: "clock_chime"
    volume: 0.7

  - type: wait
    duration: 1.0

  - type: floating_dialog
    character: "scientist"
    text: "11:47... The hour of alignment approaches."
    duration: 3.0
    style: "thoughtful"

  - type: wait
    duration: 1.0

  # Scientist heads to door
  - type: character_move
    character: "scientist"
    target: {x: 50, y: 140}
    animation: "walk"
    duration: 2.5

  - type: floating_dialog
    character: "scientist"
    text: "I must rest. Tomorrow brings the final revelation."
    duration: 3.0
    style: "tired"

  # Scientist exits
  - type: character_exit
    character: "scientist"
    direction: "left"
    duration: 1.5

  - type: sound_effect
    sound: "door_open"
    volume: 0.5

  - type: sound_effect
    sound: "door_close"
    volume: 0.4
    delay: 1.0

  - type: wait
    duration: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# ACT IV: THE THEFT
# ═══════════════════════════════════════════════════════════════════════════════

  # Lights flicker
  - type: screen_effect
    effect: "flicker"
    intensity: 0.3
    duration: 2.0
    frequency: 5.0

  - type: play_music
    track: "mystery_theme"
    volume: 0.3
    fade_in: 2.0
    crossfade: true

  - type: wait
    duration: 1.0

  # Mysterious shadow appears
  - type: show_sprite
    sprite: "shadow_figure"
    position: {x: 280, y: 130}
    scale: 1.0
    fade_in: 2.0
    color_tint: [50, 50, 80, 180]

  - type: wait
    duration: 1.0

  # Shadow moves toward crystal
  - type: move_sprite
    sprite: "shadow_figure"
    to: {x: 200, y: 120}
    duration: 3.0
    easing: "linear"

  - type: sound_effect
    sound: "footsteps"
    volume: 0.3

  - type: wait
    duration: 2.0

  # Camera shake - tension
  - type: camera_shake
    intensity: 2.0
    duration: 0.3
    frequency: 20.0

  # Crystal is taken - particles scatter
  - type: particle_effect
    effect: "sparkles"
    position: {x: 200, y: 100}
    intensity: 1.0
    duration: 1.0
    color: [255, 100, 100, 255]
    burst: true
    burst_count: 50

  - type: sound_effect
    sound: "magic_whoosh"
    volume: 0.7

  - type: hide_sprite
    sprite: "assets/items/crystal.png"
    fade_out: 0.3

  - type: wait
    duration: 0.5

  # Shadow retreats
  - type: move_sprite
    sprite: "shadow_figure"
    to: {x: 320, y: 130}
    duration: 2.0
    easing: "ease_in"

  - type: hide_sprite
    sprite: "shadow_figure"
    fade_out: 1.0

  - type: wait
    duration: 1.5

  # Dramatic fade to black
  - type: screen_flash
    color: [0, 0, 0, 255]
    duration: 0.1

  - type: camera_shake
    intensity: 8.0
    duration: 0.5
    frequency: 12.0

  - type: sound_effect
    sound: "dramatic_hit"
    volume: 0.8

  - type: fade_to_color
    color: [0, 0, 0, 255]
    duration: 1.0

  - type: wait
    duration: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# ACT V: THE DISCOVERY
# ═══════════════════════════════════════════════════════════════════════════════

  - type: show_text
    text: "The Next Morning"
    font_size: 28
    color: [200, 180, 150, 255]
    position: "center"
    fade_in: 2.0
    duration: 3.0
    fade_out: 1.0

  - type: wait
    duration: 1.0

  - type: fade_in
    duration: 2.0

  # Scientist discovers the theft
  - type: character_enter
    character: "scientist"
    from: "left"
    to: {x: 150, y: 140}
    animation: "walk"
    duration: 2.0

  - type: wait
    duration: 1.0

  - type: character_face
    character: "scientist"
    direction: "right"

  - type: camera_zoom
    target: 1.3
    focus: {x: 200, y: 100}
    duration: 1.5
    easing: "ease_out"

  - type: wait
    duration: 1.0

  # Empty display case
  - type: show_sprite
    sprite: "assets/decorations/dust.png"
    position: {x: 200, y: 100}
    scale: 1.0

  - type: particle_effect
    effect: "dust"
    position: {x: 200, y: 100}
    intensity: 0.3
    duration: 3.0

  - type: wait
    duration: 1.0

  # Scientist's reaction
  - type: camera_shake
    intensity: 4.0
    duration: 0.5
    frequency: 10.0

  - type: character_animation
    character: "scientist"
    animation: "shocked"
    duration: 1.5

  - type: sound_effect
    sound: "gasp"
    volume: 0.7

  - type: floating_dialog
    character: "scientist"
    text: "No... NO!"
    duration: 2.0
    style: "panicked"
    shake: true
    shake_intensity: 3.0

  - type: wait
    duration: 1.0

  - type: character_animation
    character: "scientist"
    animation: "distressed"
    duration: 2.0

  - type: floating_dialog
    character: "scientist"
    text: "The Crystal of Luminus... it's been stolen!"
    duration: 3.5
    style: "desperate"

  - type: wait
    duration: 1.5

  - type: floating_dialog
    character: "scientist"
    text: "I must call for help! The detective... yes!"
    duration: 3.0
    style: "frantic"

  - type: character_move
    character: "scientist"
    target: {x: 280, y: 140}
    animation: "run"
    duration: 1.5

  - type: sound_effect
    sound: "phone_ring"
    volume: 0.6
    loop: true
    loop_count: 3

  - type: wait
    duration: 3.0

# ═══════════════════════════════════════════════════════════════════════════════
# ACT VI: THE DETECTIVE ARRIVES
# ═══════════════════════════════════════════════════════════════════════════════

  - type: fade_to_color
    color: [0, 0, 0, 255]
    duration: 1.5

  - type: show_text
    text: "One Hour Later..."
    font_size: 24
    color: [180, 180, 180, 255]
    position: "center"
    fade_in: 1.5
    duration: 3.0
    fade_out: 1.0

  - type: wait
    duration: 1.0

  - type: play_music
    track: "main_theme"
    volume: 0.6
    fade_in: 3.0
    crossfade: true

  - type: fade_in
    duration: 2.0

  - type: camera_zoom
    target: 1.0
    duration: 0.1

  # Rain continues outside
  - type: particle_effect
    effect: "rain"
    position: "window"
    intensity: 0.4
    duration: 20.0
    layer: "background"

  - type: wait
    duration: 1.0

  # Door opens - detective enters
  - type: sound_effect
    sound: "door_open"
    volume: 0.6

  - type: character_enter
    character: "player"
    from: "door_to_library"
    to: {x: 100, y: 140}
    animation: "confident_walk"
    duration: 2.5

  - type: wait
    duration: 1.0

  # Detective takes in the scene
  - type: camera_follow
    character: "player"
    smooth: true
    offset: {x: 0, y: -20}

  - type: character_animation
    character: "player"
    animation: "look_around"
    duration: 2.0

  - type: wait
    duration: 1.0

  # Scientist approaches
  - type: character_move
    character: "scientist"
    target: {x: 150, y: 140}
    animation: "hurried_walk"
    duration: 1.5

  - type: character_face
    character: "scientist"
    target: "player"

  - type: character_face
    character: "player"
    target: "scientist"

  - type: wait
    duration: 0.5

  - type: floating_dialog
    character: "scientist"
    text: "Detective Williams! Thank heavens you've come!"
    duration: 3.5
    style: "relieved"

  - type: wait
    duration: 1.0

  - type: floating_dialog
    character: "player"
    text: "Professor Ashworth. I came as quickly as I could."
    duration: 3.0
    style: "professional"

  - type: wait
    duration: 0.5

  - type: character_animation
    character: "player"
    animation: "adjust_hat"
    duration: 1.0

  - type: floating_dialog
    character: "player"
    text: "Tell me everything. Start from the beginning."
    duration: 3.0
    style: "determined"

  - type: wait
    duration: 1.0

  # Camera pans to show the crime scene
  - type: camera_pan
    target: {x: 200, y: 100}
    duration: 2.0
    easing: "ease_in_out"

  - type: floating_dialog
    character: "scientist"
    text: "The Crystal of Luminus... my life's work... it's been stolen!"
    duration: 4.0
    style: "distressed"

  - type: wait
    duration: 1.0

  - type: camera_pan
    target: {x: 150, y: 130}
    duration: 1.5
    easing: "ease_in_out"

  - type: floating_dialog
    character: "player"
    text: "I see. And you suspect foul play?"
    duration: 2.5
    style: "thoughtful"

  - type: wait
    duration: 0.5

  - type: floating_dialog
    character: "scientist"
    text: "It must be! Only three people have access to this laboratory..."
    duration: 3.5
    style: "suspicious"

  - type: wait
    duration: 1.0

  - type: floating_dialog
    character: "scientist"
    text: "Myself, the butler who has served this family for twenty years..."
    duration: 3.5
    style: "thoughtful"

  - type: wait
    duration: 0.5

  - type: floating_dialog
    character: "scientist"
    text: "...and my father, who disappeared years ago."
    duration: 3.0
    style: "dark"

  - type: camera_shake
    intensity: 2.0
    duration: 0.3
    frequency: 15.0

  - type: sound_effect
    sound: "suspense_hit"
    volume: 0.5

  - type: wait
    duration: 1.5

  - type: floating_dialog
    character: "player"
    text: "Interesting. I'll need to examine the scene... and speak to everyone."
    duration: 4.0
    style: "determined"

  - type: wait
    duration: 1.0

  # Final shot - detective ready to investigate
  - type: camera_zoom
    target: 1.2
    focus: "player"
    duration: 2.0
    easing: "ease_out"

  - type: character_animation
    character: "player"
    animation: "ready"
    duration: 1.5

  - type: floating_dialog
    character: "player"
    text: "The truth always leaves traces. Let's find them."
    duration: 3.5
    style: "confident"

  - type: wait
    duration: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# FINALE: BEGIN INVESTIGATION
# ═══════════════════════════════════════════════════════════════════════════════

  - type: camera_zoom
    target: 1.0
    duration: 1.5
    easing: "ease_in_out"

  - type: show_text
    text: "THE CRYSTAL MYSTERY"
    font_size: 48
    color: [255, 220, 150, 255]
    position: "center"
    fade_in: 2.0
    duration: 4.0
    fade_out: 1.5
    glow: true
    glow_color: [255, 200, 100, 100]

  - type: show_text
    text: "Your investigation begins..."
    font_size: 20
    color: [200, 200, 200, 255]
    position: "center_bottom"
    fade_in: 1.0
    duration: 3.0
    fade_out: 1.0

  - type: wait
    duration: 2.0

  - type: stop_particle_effect
    effect: "all"

  - type: set_letterbox
    enabled: false
    duration: 1.0

  - type: fade_out
    duration: 1.5

  - type: wait
    duration: 0.5

  # Set up initial game state
  - type: set_game_state
    flags:
      - "intro_completed"
      - "scientist_met"
      - "crystal_theft_known"
    variables:
      investigation_started: true
      suspects_known: 3

  - type: show_ui

  - type: change_scene
    target: "laboratory"

  - type: fade_in
    duration: 1.5

  - type: enable_player_control

  - type: show_text
    text: "Press TAB to highlight interactive objects"
    font_size: 14
    color: [150, 200, 150, 255]
    position: "bottom"
    duration: 5.0
    fade_out: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════════════════════

variables:
  scientist_start: {x: 250, y: 140}
  player_entry: {x: 100, y: 140}
  crystal_position: {x: 200, y: 100}

checkpoints:
  - name: "prologue_end"
    time: 25.0
  - name: "manor_exterior"
    time: 45.0
  - name: "laboratory_intro"
    time: 70.0
  - name: "theft_scene"
    time: 100.0
  - name: "discovery"
    time: 130.0
  - name: "detective_arrives"
    time: 160.0

conditions:
  - name: "skip_intro"
    check: "intro_completed == true"
    skip_to: "detective_arrives"

  - name: "tutorial_mode"
    check: "difficulty == easy"
    actions:
      - type: show_text
        text: "HINT: Click on objects to examine them"
        font_size: 14
        color: [100, 255, 100, 255]
        position: "bottom"
        duration: 8.0
